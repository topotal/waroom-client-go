version: "3"

vars:
  OPENAPI_URL: "{{.OPENAPI_URL | default `https://static.waroom.com/openapi/v0.yaml`}}"
  SCHEMA_PATH: "api/openapi.yaml"
  BUILD_DIR: "dist"
  E2E_TARGET: "staging"

env:
  GOFLAGS: "-mod=mod"

tasks:
  fetch:openapi:
    desc: "Fetch OpenAPI schema"
    sources: []
    generates:
      - "{{.SCHEMA_PATH}}"
    cmds:
      - curl "{{.OPENAPI_URL}}" -o "{{.SCHEMA_PATH}}"

  gen:
    desc: "go generate ./..."
    deps: [fetch:openapi]
    cmds:
      - go generate ./...

  # sdk releaseだけなので今のとこいらない
  # build:
  #   desc: "Build app"
  #   deps: [gen]
  #   cmds:
  #     - mkdir -p {{.BUILD_DIR}}
  #     - go build -o {{.BUILD_DIR}}/app

  test:
    desc: "Run test"
    cmds:
      - go test ./... {{.CLI_ARGS}}

