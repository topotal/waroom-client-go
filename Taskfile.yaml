version: "3"

vars:
  OPENAPI_URL: "{{.OPENAPI_URL | default `https://static.waroom.com/openapi/v0.yaml`}}"
  SCHEMA_PATH: "api/openapi.yaml"
  BUILD_DIR: "dist"
  E2E_TARGET: "staging"

env:
  GOFLAGS: "-mod=mod"

tasks:
  fetch:openapi:
    desc: "Fetch the published OpenAPI schema."
    vars:
      HEADERS_OUT: '{{.HEADERS_OUT | default "/dev/null"}}'
    cmds:
      - curl -sfS --proto '=https' --max-redirs 0 --max-time 30 --max-filesize 10M -D {{shellQuote .HEADERS_OUT}} -o {{shellQuote .SCHEMA_PATH}} {{shellQuote .OPENAPI_URL}}

  gen:
    desc: "go generate ./..."
    cmds:
      - go generate ./...

  test:
    desc: "Run test"
    cmds:
      - go test ./... {{.CLI_ARGS}}

