version: "3"

vars:
  OPENAPI_URL: "{{.OPENAPI_URL | default `https://static.waroom.com/openapi/v0.yaml`}}"
  SCHEMA_PATH: "api/openapi.yaml"
  BUILD_DIR: "dist"
  E2E_TARGET: "staging"

env:
  GOFLAGS: "-mod=mod"

tasks:
  fetch:openapi:
    desc: "Fetch the published OpenAPI schema."
    cmds:
      - |
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        curl -sfS --proto '=https' --max-redirs 0 --max-time 30 --max-filesize 10M \
          -D "$tmp/headers" -o "$tmp/openapi.yaml" {{shellQuote .OPENAPI_URL}}
        if ! grep -qE '^openapi: *3\.' "$tmp/openapi.yaml" || ! grep -q '^paths:' "$tmp/openapi.yaml"; then
          echo "fetched file is not an OpenAPI 3 document: {{.OPENAPI_URL}}" >&2
          exit 1
        fi
        {{if .HEADERS_OUT}}cp "$tmp/headers" {{shellQuote .HEADERS_OUT}}{{end}}
        mv "$tmp/openapi.yaml" {{shellQuote .SCHEMA_PATH}}

  gen:
    desc: "go generate ./..."
    cmds:
      - go generate ./...

  test:
    desc: "Run test"
    cmds:
      - go test ./... {{.CLI_ARGS}}

