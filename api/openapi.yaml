  "/api/v0/users":
    get:
      tags:
      - Users
      operationId: listUsers
      summary: List users
      description: |
        組織のユーザーを返す。オンコールの API でユーザーを指定するときは、ここで返る sub を使う。
        Team / Pro プランに加えて、オンコールを契約している組織でも使える。
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
      - name: per_page
        in: query
        schema:
          type: integer
      - name: nickname
        in: query
        required: false
        schema:
          type: string
        description: nickname が完全に一致するユーザーだけを返す
      - name: slack_user_key
        in: query
        required: false
        schema:
          type: string
        description: Slack のユーザー ID（例 U0123ABCD）に紐づくユーザーだけを返す
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - inactive
          - invited
          - invitation_pending
          - invitation_failed
          - deactivated
        description: status が一致するユーザーだけを返す。招待（`POST /api/v0/users/invitations`）の進み具合を確かめるときに使う
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                required:
                - users
                - response_metadata
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      required:
                      - sub
                      - nickname
                      - picture
                      - status
                      - slack_user
                      - phone_verified
                      - created_at
                      properties:
                        sub:
                          type: string
                        nickname:
                          type: string
                        picture:
                          type: string
                        status:
                          type: string
                          enum:
                          - active
                          - inactive
                          - invited
                          - invitation_pending
                          - invitation_failed
                          - deactivated
                        slack_user:
                          oneOf:
                          - type: object
                            required:
                            - key
                            properties:
                              key:
                                type: string
                          - type: 'null'
                        phone_verified:
                          type: boolean
                          description: 電話番号の認証が済んでいるか。オンコールのローテーションに入れられるのは認証済みのユーザーだけ。
                        created_at:
                          type: string
                          format: date-time
                  response_metadata:
                    type: object
                    required:
                    - current_page
                    - next_page
                    - prev_page
                    - total_pages
                    - total_count
                    properties:
                      current_page:
                        type: integer
                      next_page:
                        type:
                        - integer
                        - 'null'
                      prev_page:
                        type:
                        - integer
                        - 'null'
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: string
        '402':
          description: Payment required. The V0 Public API is available only on the
            Team or Pro plan.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
  "/api/v0/users/invitations":
    post:
      tags:
      - Users
      operationId: inviteUsers
      summary: Invite users
      description: |
        メールアドレスを指定して、ユーザーを組織にまとめて招待する。招待されたユーザーのロールは admin になる。

        招待は非同期で進む。レスポンスで返るユーザーの `status` は `invitation_pending` で、招待メールを送り終えると `invited`、
        失敗すると `invitation_failed` になる。進み具合は `GET /api/v0/users/{sub}` か、`GET /api/v0/users?status=invitation_pending` で確かめる。
        招待するユーザーごとに数秒ずつずらして処理するため、人数が多いと全員が `invited` になるまで数分かかる。

        - 1 回のリクエストで招待できるのは 50 人まで。重複するメールアドレスは 1 人として数える
        - 同じ組織からは 1 分に 1 回まで呼べる（組織の API キーが複数あっても合わせて数える）。超えると 429 を返す
        - ユーザーの nickname はメールアドレスの @ より前から作る。同じ nickname のユーザーが組織にいる、またはリクエストの中で重なるときは 409 を返し、誰も招待しない
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
