  "/api/v0/incidents/{uuid}/status":
    patch:
      tags:
      - Incidents
      operationId: updateIncidentStatus
      summary: Update incident status
      security:
      - bearerAuth: []
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - detected
                  - investigating
                  - fixing
                  - resolved
                  - close
                  description: New status for the incident
      responses:
