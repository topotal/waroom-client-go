  "/api/v0/users":
    get:
      tags:
      - Users
      operationId: listUsers
      summary: List users
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
      - name: per_page
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                required:
                - users
                - response_metadata
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      required:
                      - sub
                      - nickname
                      - picture
                      - status
                      - slack_user
                      - created_at
                      properties:
                        sub:
                          type: string
                        nickname:
                          type: string
                        picture:
                          type: string
                        status:
                          type: string
                          enum:
                          - active
                          - inactive
                          - invited
                          - invitation_pending
                          - invitation_failed
                          - deactivated
                        slack_user:
                          oneOf:
                          - type: object
                            required:
                            - key
                            properties:
                              key:
                                type: string
                          - type: 'null'
                        created_at:
                          type: string
                          format: date-time
                  response_metadata:
                    type: object
                    required:
                    - current_page
                    - next_page
                    - prev_page
                    - total_pages
                    - total_count
                    properties:
                      current_page:
                        type: integer
                      next_page:
                        type:
                        - integer
                        - 'null'
                      prev_page:
                        type:
                        - integer
                        - 'null'
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
