      - bearerAuth: []
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
        description: On-call team UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - team
              properties:
                team:
                  type: object
                  properties:
                    name:
                      type: string
                    color:
                      type: string
                      description: 色（6 桁の 16 進数、# なし）
                    rotations:
                      type: array
                      minItems: 1
                      description: 'ローテーション。送ると丸ごと置き換える。1 つ以上必要で、配列の順が並び順になる

                        '
                      items:
                        type: object
                        required:
                        - timezone
                        - started_at
                        - shift_handoff_time
                        description: 'チームのローテーション 1 つ分の入力。配列の順がローテーションの並び順（position）になる。

                          '
                        properties:
                          uuid:
                            type: string
                            description: 今あるローテーションを残して更新するときに指定する。省略すると新しいローテーションを作る
                          timezone:
                            type: string
                            description: ローテーションの基準になるタイムゾーン（IANA 形式。例 Asia/Tokyo）
                          started_at:
                            type: string
                            description: |
                              最初のシフトの基準日時（ISO 8601）。shift_handoff_wday / shift_handoff_time に合わせて補正して保存する。
                              interval_days が 7 の倍数のときは、この日時以前で直近の交代の曜日・時刻に、それ以外は同じ日の交代の時刻にする
                          shift_handoff_time:
                            type: string
                            description: 交代の時刻（HH:MM）。timezone における時刻
                          shift_handoff_wday:
                            type:
                            - integer
                            - 'null'
                            description: 交代の曜日（0 が日曜、6 が土曜）。interval_days が 7 の倍数のときは必須
                          interval_days:
                            type: integer
                            minimum: 1
                            maximum: 14
                            description: 交代の間隔（日数、1〜14）。省略すると、今あるローテーションは今の値、新しいローテーションは
                              7
                          participants:
                            type: array
                            description: |
                              参加者。送ると丸ごと置き換える（空の配列なら参加者なし）。
                              省略すると、uuid を指定した今あるローテーションは今の参加者のまま、新しいローテーションは参加者なし。
                              電話番号の確認が済んでいるユーザーだけを指定できる
                            items:
                              type: object
                              required:
                              - user_sub
                              - position
                              properties:
                                user_sub:
                                  type: string
                                  description: ユーザーの sub（GET /api/v0/users で調べられる）
                                position:
                                  type: integer
                                  description: 当番の順番（0 から）
                          time_slots:
