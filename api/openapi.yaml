  "/api/v0/incidents/{uuid}/metrics":
    post:
      tags:
      - Incidents
      operationId: createIncidentMetrics
      summary: Create incident metrics (response activity)
      description: Creates an incident response activity to track metrics like TTD,
        TTA, TTI, TTF, TTR
      security:
      - bearerAuth: []
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - activity_action
              properties:
                activity_action:
                  type: string
                  enum:
                  - triggered
                  - detected
                  - investigating
                  - fixing
                  - resolved
                  - close
                  description: The action type for the response activity
                triggered_at:
                  type: string
                  format: date-time
                  description: When the activity was triggered (defaults to current
                    time)
      responses:
        '200':
          description: Metrics created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - uuid
                - action
                - triggered_at
                - incident
                properties:
                  uuid:
                    type: string
                    format: uuid
                  action:
                    type: string
                  triggered_at:
                    type: string
                    format: date-time
                  incident:
                    type: object
                    required:
                    - uuid
                    - title
                    - ttd
                    - tta
                    - tti
                    - ttf
                    - ttr
                    properties:
                      uuid:
                        type: string
                        format: uuid
                      title:
                        type: string
                      ttd:
                        type:
                        - integer
                        - 'null'
                        description: Time to Detect (seconds)
                      tta:
                        type:
                        - integer
                        - 'null'
                        description: Time to Acknowledge (seconds)
                      tti:
                        type:
                        - integer
                        - 'null'
                        description: Time to Investigate (seconds)
                      ttf:
                        type:
                        - integer
                        - 'null'
                        description: Time to Fix (seconds)
                      ttr:
                        type:
                        - integer
                        - 'null'
                        description: Time to Resolve (seconds)
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: string
        '402':
          description: Payment required. The V0 Public API is available only on the
            Team or Pro plan.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
