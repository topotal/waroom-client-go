  "/api/v0/on_call/triggers":
    get:
      tags:
      - On-Call
      operationId: listOnCallTriggers
      summary: List on-call triggers
      description: 'オンコールのトリガー（インシデントからエスカレーションポリシーを呼び出す条件）を返す。

        '
      security:
      - bearerAuth: []
      parameters:
      - name: service_name
        in: query
        required: false
        schema:
          type: string
        description: このサービスのトリガーだけを返す
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: List of on-call triggers
          content:
            application/json:
              schema:
                type: object
                required:
                - triggers
                - response_metadata
                properties:
                  triggers:
                    type: array
                    items:
                      type: object
                      required:
                      - uuid
                      - name
                      - enabled
                      - event_type
                      - severity_filters
                      - source_filters
                      - retry_count
                      - service
                      - escalation_policies
                      properties:
                        uuid:
                          type: string
                        name:
                          type: string
                        enabled:
                          type: boolean
                        event_type:
                          type: string
                          enum:
                          - incident_created
                          description: 呼び出しのきっかけ。今は incident_created（インシデントの作成）だけ
                        severity_filters:
                          type: array
                          description: 呼び出しの対象にするインシデントの重要度
                          items:
                            type: string
                            enum:
                            - critical
                            - high
                            - low
                            - info
                            - unknown
                        source_filters:
                          type: array
                          description: 呼び出しの対象にするインシデントの作成元
                          items:
                            type: string
                            enum:
                            - integration
                            - slack
                            - web
                        retry_count:
                          type: integer
                          minimum: 0
                          maximum: 10
                          description: 誰も応答しなかったとき、エスカレーションを最初からやり直す回数
                        service:
                          type: object
                          required:
                          - name
                          properties:
                            name:
                              type: string
                        escalation_policies:
                          type: array
                          description: 呼び出すエスカレーションポリシー
                          items:
                            type: object
                            required:
                            - uuid
                            - name
                            properties:
                              uuid:
                                type: string
                              name:
                                type: string
                  response_metadata:
                    type: object
                    required:
                    - current_page
                    - next_page
                    - prev_page
                    - total_pages
                    - total_count
                    properties:
                      current_page:
                        type: integer
                      next_page:
                        type:
                        - integer
                        - 'null'
                      prev_page:
                        type:
                        - integer
                        - 'null'
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: string
        '402':
          description: Payment required. The on-call API requires the on-call plan
            or the on-call option.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
    post:
      tags:
      - On-Call
      operationId: createOnCallTrigger
      summary: Create an on-call trigger
      description: 'オンコールのトリガーを作る。存在しないサービスやエスカレーションポリシーを指定したときは 422 になる。

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - trigger
              properties:
                trigger:
                  type: object
                  required:
                  - name
                  - service_name
                  - escalation_policy_uuids
                  - severity_filters
                  properties:
                    name:
                      type: string
                    service_name:
                      type: string
                      description: トリガーを付けるサービスの名前
                    escalation_policy_uuids:
                      type: array
                      minItems: 1
                      description: 呼び出すエスカレーションポリシーの UUID。1 つ以上必要
                      items:
                        type: string
                    severity_filters:
                      type: array
                      description: 呼び出しの対象にするインシデントの重要度
                      items:
                        type: string
                        enum:
                        - critical
                        - high
                        - low
                        - info
                        - unknown
                    source_filters:
                      type: array
                      description: 呼び出しの対象にするインシデントの作成元。POST で省略すると integration だけ
                      items:
                        type: string
                        enum:
                        - integration
                        - slack
                        - web
                    enabled:
                      type: boolean
                      description: POST で省略すると true
                    event_type:
                      type: string
                      enum:
                      - incident_created
                      description: POST で省略すると incident_created
                    retry_count:
                      type: integer
                      description: 誰も応答しなかったとき、エスカレーションを最初からやり直す回数（0〜10）。POST で省略すると
                        0
      responses:
        '201':
          description: On-call trigger created
          content:
            application/json:
              schema:
                type: object
                required:
                - trigger
                properties:
                  trigger:
                    type: object
                    required:
                    - uuid
                    - name
                    - enabled
                    - event_type
                    - severity_filters
                    - source_filters
                    - retry_count
                    - service
                    - escalation_policies
                    properties:
                      uuid:
                        type: string
                      name:
                        type: string
                      enabled:
                        type: boolean
                      event_type:
                        type: string
                        enum:
                        - incident_created
                        description: 呼び出しのきっかけ。今は incident_created（インシデントの作成）だけ
                      severity_filters:
                        type: array
                        description: 呼び出しの対象にするインシデントの重要度
                        items:
                          type: string
                          enum:
                          - critical
                          - high
                          - low
                          - info
                          - unknown
                      source_filters:
                        type: array
                        description: 呼び出しの対象にするインシデントの作成元
                        items:
                          type: string
                          enum:
                          - integration
                          - slack
                          - web
                      retry_count:
                        type: integer
                        minimum: 0
                        maximum: 10
                        description: 誰も応答しなかったとき、エスカレーションを最初からやり直す回数
                      service:
                        type: object
                        required:
                        - name
                        properties:
                          name:
                            type: string
                      escalation_policies:
                        type: array
                        description: 呼び出すエスカレーションポリシー
                        items:
                          type: object
                          required:
                          - uuid
                          - name
                          properties:
                            uuid:
                              type: string
                            name:
                              type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: string
        '402':
          description: Payment required. The on-call API requires the on-call plan
            or the on-call option.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '422':
          description: |
            Validation error. ローテーションの要素で起きたエラーのときは、配列の何番目かを rotation_index で返す。
            プランの上限（チーム数・対応者数）を超えるときも 422 になる。
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                  rotation_index:
                    type: integer
                    minimum: 0
