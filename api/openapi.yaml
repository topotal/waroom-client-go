                  error:
                    type: string
  "/api/v0/on_call/teams":
    get:
      tags:
      - On-Call
      operationId: listOnCallTeams
      summary: List on-call teams
      description: 'オンコールのチームを、ローテーションの設定と現在の当番つきで返す。

        '
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: List of on-call teams
          content:
            application/json:
              schema:
                type: object
                required:
                - teams
                - response_metadata
                properties:
                  teams:
                    type: array
                    items:
                      type: object
                      required:
                      - uuid
                      - name
                      - color
                      - rotation
                      - rotations
                      - on_duty_participant
                      properties:
                        uuid:
                          type: string
                        name:
                          type: string
                        color:
                          type: string
                          description: 6 桁の 16 進数（# なし）
                        rotation:
                          description: |
                            並び順（position）が最初のローテーション。ローテーションが設定されていないチームでは null になる。
                            1 つのチームに複数のローテーション（平日・土日など）を持てるため、すべてを扱うときは rotations を使う
                          oneOf:
                          - type: object
                            required:
                            - uuid
                            - position
                            - timezone
                            - started_at
                            - interval_days
                            - shift_handoff_wday
                            - shift_handoff_time
                            - time_slots
                            - participants
                            - on_duty_participant
                            properties:
                              uuid:
                                type: string
                              position:
                                type: integer
                                minimum: 0
                                description: 同じチームの中の並び順。有効な時間が重なったときは小さい方のローテーションの当番が呼ばれる
                              timezone:
                                type: string
                                description: ローテーションの基準になるタイムゾーン（IANA 形式）。started_at
                                  のオフセットもこれに従う
                              started_at:
                                type: string
                                format: date-time
                                description: 最初のシフトが始まった日時。ここから引き継ぎの曜日と時刻が決まる
                              interval_days:
                                type: integer
                                minimum: 1
                                maximum: 14
                                description: 交代の間隔（日数）。started_at から interval_days
                                  日ごとに次の参加者へ引き継ぐ。7 なら毎週
                              shift_handoff_wday:
                                type:
                                - integer
                                - 'null'
                                minimum: 0
                                maximum: 6
