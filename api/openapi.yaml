                      - all_members
                      - on_duty_only
                      description: 各ステップのチームで誰に架電するか（on_call_escalation_policy の team_call_mode
                        を参照）。省略すると変更しない
                    steps:
                      type: array
                      description: 'ステップ。送ると丸ごと置き換える。配列の順がエスカレーションの順（position）になる

                        '
                      items:
                        type: object
                        required:
                        - team_uuid
                        properties:
                          team_uuid:
                            type: string
                            description: 呼び出すオンコールのチームの UUID
                          step_type:
                            type: string
                            enum:
                            - primary
                            - fallback
                            description: 省略すると primary
                          simultaneous_call:
                            type: boolean
                            description: 'true にすると、このステップではチームの今有効なローテの参加者全員に同時に架電する（画面の「全員に同時」）。省略すると
                              false

                              '
                    time_slots:
                      type: array
                      minItems: 1
                      description: '呼び出しの対象になる曜日・時間。送ると丸ごと置き換える。1 つ以上必要

                        '
                      items:
                        type: object
                        required:
                        - day_of_week
                        - start_time
                        - end_time
                        properties:
                          day_of_week:
                            type: integer
                            description: 0 が日曜、6 が土曜
                          start_time:
                            type: string
                            description: 開始時刻（HH:MM）。ポリシーの timezone における時刻
                          end_time:
                            type: string
                            description: 終了時刻（HH:MM）。start_time より前なら翌日まで続く。23:59
                              は日末までを含む
      responses:
        '200':
          description: On-call escalation policy updated
          content:
            application/json:
              schema:
                type: object
                required:
                - escalation_policy
                properties:
                  escalation_policy:
                    type: object
                    required:
                    - uuid
                    - name
                    - timezone
                    - team_call_mode
                    - steps
                    - time_slots
                    properties:
                      uuid:
                        type: string
                      name:
                        type: string
                      timezone:
                        type: string
                        description: 当番表を組む基準になるタイムゾーン（IANA 形式）
                      team_call_mode:
                        type: string
                        enum:
                        - all_members
                        - on_duty_only
                        description: |
                          各ステップのチームで誰に架電するか。
                          all_members は当番から順にチームの全員に架電し、全員が出なければ次のステップへ進む。
                          on_duty_only は当番だけに架電し、出なければ（架電できなくても）次のステップへ進む。
                          どちらでも、simultaneous_call のステップではチームの全員に同時に架電する
                      steps:
                        type: array
                        description: エスカレーションの順番（position の昇順）
                        items:
                          type: object
                          required:
                          - uuid
                          - position
                          - step_type
                          - simultaneous_call
                          - team
                          properties:
                            uuid:
                              type: string
                            position:
                              type: integer
                              description: エスカレーションの順番。0 から始まる
                            step_type:
                              type: string
                              enum:
                              - primary
                              - fallback
                            simultaneous_call:
                              type: boolean
                              description: true のステップでは、チームの今有効なローテの参加者全員に同時に架電する（画面の「全員に同時」）
                            team:
                              type: object
                              required:
                              - uuid
                              - name
                              - color
                              properties:
                                uuid:
                                  type: string
                                name:
                                  type: string
                                color:
                                  type: string
                                  description: 6 桁の 16 進数（# なし）
                      time_slots:
                        type: array
                        description: オンコールが有効な曜日と時間帯。day_of_week、start_time の順に並ぶ
                        items:
                          type: object
                          required:
                          - uuid
                          - day_of_week
                          - start_time
                          - end_time
                          properties:
                            uuid:
                              type: string
                            day_of_week:
                              type: integer
                              minimum: 0
                              maximum: 6
                              description: 0 が日曜、6 が土曜
                            start_time:
                              type: string
                              description: 開始時刻（HH:MM）。エスカレーションポリシーの timezone における時刻
                            end_time:
                              type: string
                              description: |
                                終了時刻（HH:MM）。エスカレーションポリシーの timezone における時刻。
                                start_time より前の値のときは翌日まで続く時間帯を表す（例 22:00-02:00）。
                                23:59 は日末（翌日 00:00 の直前）までを含む。
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: string
        '402':
          description: Payment required. The on-call API requires the on-call plan
            or the on-call option.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '422':
          description: |
            Validation error. ローテーションの要素で起きたエラーのときは、配列の何番目かを rotation_index で返す。
            プランの上限（チーム数・対応者数）を超えるときも 422 になる。
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                  rotation_index:
                    type: integer
                    minimum: 0
    delete:
      tags:
      - On-Call
      operationId: deleteOnCallEscalationPolicy
      summary: Delete an on-call escalation policy
      description: |
        エスカレーションポリシーを削除する。このポリシーだけにつながるトリガーも消える。
        架電の履歴があるポリシーは削除できず、422 になる。
      security:
      - bearerAuth: []
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
        description: On-call escalation policy UUID
      responses:
        '204':
          description: On-call escalation policy deleted
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: string
        '402':
          description: Payment required. The on-call API requires the on-call plan
            or the on-call option.
          content:
