---
openapi: 3.0.3
info:
  title: Waroom V0 Public API
  description: Public API for Waroom incident management system
  version: 1.0.0
  contact:
    name: Waroom Development Team
servers:
- url: "/api/v0"
  description: Public API server
security:
- ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
  responses:
    UnauthorizedError:
      description: Authentication information is missing or invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
                example:
                - Not Authenticated
    NotFoundError:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Not found
    UnprocessableEntityError:
      description: The request was well-formed but was unable to be followed due to
        semantic errors
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Validation failed
    ConflictError:
      description: The request could not be completed due to a conflict with the current
        state of the resource
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Name has already been taken
    BadRequestError:
      description: The request was malformed or contained invalid parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Invalid severity
    MessageError:
      description: Error response with message field
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Couldn't find Incident
  PaginationMeta:
    description: Pagination metadata
    content:
      application/json:
        schema:
          type: object
          properties:
            current_page:
              type: integer
              example: 1
            next_page:
              type: integer
              nullable: true
              example: 2
            prev_page:
              type: integer
              nullable: true
              example:
            total_pages:
              type: integer
              example: 2
            total_count:
              type: integer
              example: 100
  schemas:
    Label:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          description: Unique identifier for the labels
          example: 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
        name:
          type: string
          description: Label name
          example: database
        color:
          type: string
          pattern: "^[0-9a-fA-F]{6}$"
          description: Label color in hex format (without#)
          example: ff0000
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2024-01-15T10:30:00Z'
          readOnly: true
      required:
        - uuid
        - name
    Service:
      type: object
      properties:
        name:
          type: string
          description: Service name
          example: web-api
        labels:
          type: array
          items:
            "$ref": "#/components/schemas/IncidentLabel"
      required:
      - name
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: User ID
          example: 456
        name:
          type: string
          description: User name
          example: John Doe
        email:
          type: string
          format: email
          description: User email address
          example: john.doe@example.com
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2024-01-15T10:30:00Z'
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
          example: '2024-01-15T11:45:00Z'
      required:
      - id
      - name
      - email
      - created_at
      - updated_at
    IncidentLabel:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          description: Unique identifier for the labels
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          description: Label name
          example: database
        color:
          type: string
          pattern: "^[0-9a-fA-F]{6}$"
          description: Label color in hex format (without
          example: ff0000
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2024-01-15T10:30:00Z'
      required:
      - uuid
      - name
      - created_at
    Postmortem:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Postmortem ID
          example: 111
        title:
          type: string
          description: Postmortem title
          example: Database Timeout Incident Postmortem
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2024-01-15T10:30:00Z'
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
          example: '2024-01-15T11:45:00Z'
      required:
      - id
      - title
      - created_at
      - updated_at
    ResponseMetadata:
      type: object
      properties:
        current_page:
          type: integer
          description: Current page number
          example: 1
        next_page:
          type: integer
          nullable: true
          description: Next page number
          example: 2
        prev_page:
          type: integer
          nullable: true
          description: Previous page number
          example:
        total_pages:
          type: integer
          description: Total number of pages
          example: 2
        total_count:
          type: integer
          description: Total number of items
          example: 100
      required:
      - current_page
      - total_pages
      - total_count
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: Not found
      required:
      - error
    Incident:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          description: Unique identifier for the incident
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          description: Incident title
          example: Production database connection timeout
        severity:
          type: string
          enum:
          - critical
          - high
          - low
          - info
          - unknown
          description: Severity level of the incident
          example: high
        status:
          type: string
          enum:
          - detected
          - investigating
          - fixing
          - resolved
          - close
          description: Current status of the incident
          example: investigating
        root_cause:
          type: string
          enum:
          - unspecified
          - code_bug
          - configuration_error
          - deployment_failure
          - infrastructure_failure
          - operational_failure
          - third_party_outage
          - other
          description: Root cause category
          example: infrastructure_failure
        experimental:
          type: boolean
          description: Whether this is an experimental incident
          example: false
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2024-01-15T10:30:00Z'
        metrics:
          type: object
          properties:
            ttd:
              type: integer
              nullable: true
              description: Time to detect (in seconds)
              example: 300
            tta:
              type: integer
              nullable: true
              description: Time to acknowledge (in seconds)
              example: 600
            tti:
              type: integer
              nullable: true
              description: Time to investigate (in seconds)
              example: 900
            ttf:
              type: integer
              nullable: true
              description: Time to fix (in seconds)
              example: 1800
            ttr:
              type: integer
              nullable: true
              description: Time to repair (in seconds)
              example: 3600
        service:
          "$ref": "#/components/schemas/Service"
        labels:
          type: array
          items:
            "$ref": "#/components/schemas/IncidentLabel"
      required:
      - uuid
      - title
      - severity
      - status
      - root_cause
      - experimental
      - created_at
      - metrics
      - service
      - labels
    IncidentListResponse:
      type: object
      properties:
        incidents:
          type: array
          items:
            "$ref": "#/components/schemas/Incident"
        response_metadata:
          "$ref": "#/components/schemas/ResponseMetadata"
      required:
      - incidents
      - response_metadata
    ServicesListResponse:
      type: object
      properties:
        services:
          type: array
          items:
            "$ref": "#/components/schemas/Service"
        response_metadata:
          "$ref": "#/components/schemas/ResponseMetadata"
      required:
      - services
      - response_metadata
    IncidentUpdateResponse:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          description: Incident UUID
          example: 123e4567-e89b-12d3-a456-426614174000
        severity:
          type: string
          enum:
          - critical
          - high
          - low
          - info
          - unknown
          description: Updated severity level
          example: critical
      required:
      - uuid
      - severity
    IncidentStatusUpdateResponse:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          description: Incident UUID
          example: 123e4567-e89b-12d3-a456-426614174000
        status:
          type: string
          enum:
          - detected
          - investigating
          - fixing
          - resolved
          - close
          description: Updated status
          example: investigating
      required:
      - uuid
      - status
    IncidentLabelsUpdateResponse:
      type: object
      properties:
        labels:
          type: array
          items:
            "$ref": "#/components/schemas/IncidentLabel"
          description: Updated incident labels
      required:
      - labels
    IncidentMetricsResponse:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          description: Activity UUID
          example: 123e4567-e89b-12d3-a456-426614174000
        action:
          type: string
          description: Activity action
          example: investigating
        triggered_at:
          type: string
          format: date-time
          description: When the activity was triggered
          example: '2024-01-15T10:30:00Z'
        incident:
          type: object
          properties:
            uuid:
              type: string
              format: uuid
              description: Incident UUID
              example: 123e4567-e89b-12d3-a456-426614174000
            title:
              type: string
              description: Incident title
              example: Production database connection timeout
            ttd:
              type: integer
              nullable: true
              description: Time to detect (in seconds)
              example: 300
            tta:
              type: integer
              nullable: true
              description: Time to acknowledge (in seconds)
              example: 600
            tti:
              type: integer
              nullable: true
              description: Time to investigate (in seconds)
              example: 900
            ttf:
              type: integer
              nullable: true
              description: Time to fix (in seconds)
              example: 1800
            ttr:
              type: integer
              nullable: true
              description: Time to repair (in seconds)
              example: 3600
          required:
          - uuid
          - title
      required:
      - uuid
      - action
      - triggered_at
      - incident
paths:
  "/incidents":
    get:
      summary: List incidents
      description: Retrieve a paginated list of incidents
      operationId: listIncidents
      tags:
      - Incidents
      parameters:
      - name: page
        in: query
        description: Page number for pagination
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Successfully retrieved incidents
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IncidentListResponse"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
      security:
      - ApiKeyAuth: []
  "/incidents/{uuid}":
    get:
      summary: Get incident by UUID
      description: Retrieve a specific incident by its UUID
      operationId: getIncident
      tags:
      - Incidents
      parameters:
      - name: uuid
        in: path
        required: true
        description: Incident UUID
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successfully retrieved incident
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Incident"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
      security:
      - ApiKeyAuth: []
    # post:
    #   summary: Create incident
    #   description: Create a new incident
    #   operationId: createIncident
    #   tags:
    #   - Incidents
    #   requestBody:
    #     required: true
    #     content:
    #       application/json:
    #         schema:
    #           type: object
    #           properties:
    #             incident:
    #               type: object
    #               properties:
    #                 service_name:
    #                   type: string
    #                   description: Service name
    #                   example: web-api
    #                 title:
    #                   type: string
    #                   description: Incident title
    #                   example: Production database connection timeout
    #                 severity:
    #                   type: string
    #                   enum:
    #                   - critical
    #                   - high
    #                   - low
    #                   - info
    #                   - unknown
    #                   description: Severity level of the incident
    #                   example: high
    #                 experimental:
    #                   type: boolean
    #                   description: Whether this is an experimental incident
    #                   example: false
    #                 description:
    #                   type: string
    #                   description: Incident description
    #                   example: Database connection timeout occurred
    #                 is_private:
    #                   type: boolean
    #                   description: Whether this is a private incident
    #                   example: false
    #               required:
    #               - service_name
    #               - title
    #               - severity
    #           required:
    #           - incident
    #   responses:
    #     '201':
    #       description: Successfully created incident
    #       content:
    #         application/json:
    #           schema:
    #             "$ref": "#/components/schemas/Incident"
    #     '401':
    #       "$ref": "#/components/responses/UnauthorizedError"
    #     '404':
    #       "$ref": "#/components/responses/NotFoundError"
    #     '422':
    #       "$ref": "#/components/responses/UnprocessableEntityError"
      # security:
      # - ApiKeyAuth: []
  "/incidents/{uuid}/severity":
    patch:
      summary: Update incident severity
      description: Update the severity of an incident
      operationId: updateIncidentSeverity
      tags:
      - Incidents
      parameters:
      - name: uuid
        in: path
        required: true
        description: Incident UUID
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                severity:
                  type: string
                  enum:
                  - critical
                  - high
                  - low
                  - info
                  - unknown
                  description: New severity level
                  example: critical
              required:
              - severity
      responses:
        '200':
          description: Successfully updated incident severity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IncidentUpdateResponse"
        '400':
          "$ref": "#/components/responses/BadRequestError"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
      security:
      - ApiKeyAuth: []
  "/incidents/{uuid}/status":
    patch:
      summary: Update incident status
      description: Update the status of an incident
      operationId: updateIncidentStatus
      tags:
      - Incidents
      parameters:
      - name: uuid
        in: path
        required: true
        description: Incident UUID
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - detected
                  - investigating
                  - fixing
                  - resolved
                  - close
                  description: New status
                  example: investigating
              required:
              - status
      responses:
        '200':
          description: Successfully updated incident status
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IncidentStatusUpdateResponse"
        '400':
          "$ref": "#/components/responses/BadRequestError"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
      security:
      - ApiKeyAuth: []
  "/incidents/{uuid}/labels":
    patch:
      summary: Update incident labels
      description: Update the labels associated with an incident
      operationId: updateIncidentLabels
      tags:
      - Incidents
      parameters:
      - name: uuid
        in: path
        required: true
        description: Incident UUID
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label_uuids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Array of label UUIDs to associate with the incident
                  example:
                  - 123e4567-e89b-12d3-a456-426614174000
              required:
              - label_uuids
      responses:
        '200':
          description: Successfully updated incident labels
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IncidentLabelsUpdateResponse"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
      security:
      - ApiKeyAuth: []
  "/incidents/{uuid}/metrics":
    post:
      summary: Create incident metrics activity
      description: Create a new activity to track incident metrics
      operationId: createIncidentMetrics
      tags:
      - Incidents
      parameters:
      - name: uuid
        in: path
        required: true
        description: Incident UUID
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                incident_uuid:
                  type: string
                  format: uuid
                  description: Incident UUID
                  example: 123e4567-e89b-12d3-a456-426614174000
                activity_action:
                  type: string
                  description: Activity action
                  example: investigating
                triggered_at:
                  type: string
                  format: date-time
                  description: When the activity was triggered
                  example: '2024-01-15T10:30:00Z'
              required:
              - incident_uuid
              - activity_action
              - triggered_at
      responses:
        '200':
          description: Successfully created incident metrics activity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IncidentMetricsResponse"
        '400':
          "$ref": "#/components/responses/MessageError"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '404':
          "$ref": "#/components/responses/MessageError"
      security:
      - ApiKeyAuth: []
  "/postmortems":
    get:
      summary: List postmortems
      description: Retrieve a paginated list of postmortems
      operationId: listPostmortems
      tags:
      - Postmortems
      parameters:
      - name: page
        in: query
        description: Page number for pagination
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Successfully retrieved postmortems
          content:
            application/json:
              schema:
                type: object
                properties:
                  postmortems:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Postmortem"
                  response_metadata:
                    "$ref": "#/components/schemas/ResponseMetadata"
                required:
                - postmortems
                - response_metadata
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
      security:
      - ApiKeyAuth: []
    post:
      summary: Create postmortem
      description: Create a new postmortem
      operationId: createPostmortem
      tags:
      - Postmortems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Postmortem title
                  example: Database Timeout Incident Postmortem
                blob:
                  type: string
                  description: Postmortem content
                  example: |-
                    ## Summary
                    Database timeout occurred...
                status:
                  type: string
                  enum:
                  - draft
                  - published
                  description: Postmortem status
                  example: draft
                incident_uuids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Associated incident UUIDs
                  example:
                  - 123e4567-e89b-12d3-a456-426614174000
              required:
              - title
              - blob
              - status
      responses:
        '200':
          description: Successfully created postmortem
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Postmortem"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '422':
          "$ref": "#/components/responses/UnprocessableEntityError"
      security:
      - ApiKeyAuth: []
  "/services":
    get:
      summary: List services
      description: Retrieve a paginated list of services
      operationId: listServices
      tags:
      - Services
      parameters:
      - name: page
        in: query
        description: Page number for pagination
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Successfully retrieved services
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ServicesListResponse"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
      security:
      - ApiKeyAuth: []

  /services/{name}/labels:
    get:
      tags: [Services]
      summary: List labels on a service
      operationId: listServiceLabels
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items: { $ref: '#/components/schemas/Label' }
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
      security:
        - ApiKeyAuth: []
    post:
      tags: [Services]
      summary: Create label on a service
      operationId: createServiceLabel
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Label' }
      responses:
        "201":
          description: Created
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '409':
          "$ref": "#/components/responses/ConflictError"
        '422':
          "$ref": "#/components/responses/UnprocessableEntityError"
      security:
        - ApiKeyAuth: []

  /services/{name}/labels/{uuid}:
    # TODO: impl
    # put:
    #   summary: Update/replace a label
    #   tags: [Services]
    #   operationId: updateServiceLabel
    #   parameters:
    #     - name: name
    #       in: path
    #       required: true
    #       schema: { type: string }
    #     - name: uuid
    #       in: path
    #       required: true
    #       schema: { type: string, format: uuid }
    #   requestBody:
    #     required: true
    #     content:
    #       application/json:
    #         schema: { $ref: '#/components/schemas/Label' }
    #   responses:
    #     '200': { description: Updated }
    delete:
      summary: Delete a label
      tags: [Services]
      operationId: deleteServiceLabel
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: No Content
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
