              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '422':
          description: |
            Validation error. ローテーションの要素で起きたエラーのときは、配列の何番目かを rotation_index で返す。
            プランの上限（チーム数・対応者数）を超えるときも 422 になる。
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                  rotation_index:
                    type: integer
                    minimum: 0
  "/api/v0/on_call/escalation_policies/{uuid}/schedule":
    get:
      tags:
      - On-Call
      operationId: getOnCallEscalationPolicySchedule
      summary: Get the on-call schedule of an escalation policy
      description: |
        エスカレーションポリシーの当番表を日ごとに返す。

        start_date / end_date はどちらも省略できる。省略された側は 7 日分になるように補い、
        両方とも省略された場合はエスカレーションポリシーの timezone における今日から 7 日分を返す。
        両方を指定する場合の期間は最大 42 日。
      security:
      - bearerAuth: []
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
        description: Escalation policy UUID
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 開始日（YYYY-MM-DD）。省略時は end_date から 7 日分さかのぼった日、両方省略時は今日
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 終了日（YYYY-MM-DD）。省略時は start_date から 7 日分
      responses:
        '200':
          description: On-call schedule
          content:
            application/json:
              schema:
                type: object
                required:
                - schedule
                properties:
                  schedule:
                    type: object
                    required:
                    - escalation_policy
                    - days
                    properties:
                      escalation_policy:
                        type: object
                        required:
                        - uuid
                        - name
                        - timezone
                        properties:
                          uuid:
                            type: string
                          name:
                            type: string
                          timezone:
                            type: string
                            description: 当番表を組む基準になるタイムゾーン（IANA 形式）。start_at / end_at
                              のオフセットもこれに従う
                      days:
                        type: array
                        description: |
                          start_date から end_date までの各日。日付をまたぐ時間帯があると、
                          最終日の entry の end_at が end_date の翌日になることがある。
                          逆に start_date の前日から続く時間帯は含まれない。
                        items:
                          type: object
                          required:
                          - date
                          - day_of_week
                          - active
                          - entries
                          properties:
                            date:
                              type: string
                              format: date
                            day_of_week:
                              type: integer
                              minimum: 0
                              maximum: 6
                              description: 0 が日曜、6 が土曜
                            active:
                              type: boolean
                              description: |
                                その日に entries があり得るかどうか。その曜日に時間帯が設定されているときと、
                                前日から日付をまたぐ時間帯が交代時刻で区切られ、その日に始まる区間があるときに true になる。
                                false のとき entries は空になる
                            entries:
                              type: array
                              description: |
                                その日に始まる当番の区間。時間帯の途中でローテーションの交代があるときは、交代時刻で区切った区間ごとに分かれる。
                                日付をまたぐ時間帯を交代時刻で区切った後ろ側は、区間が始まる日（翌日）の entries に入る
                              items:
                                type: object
                                required:
                                - escalation_policy_step
                                - on_duty_user
                                - start_at
                                - end_at
                                - override
                                properties:
                                  escalation_policy_step:
                                    type: object
                                    required:
                                    - uuid
                                    - position
                                    - step_type
                                    - simultaneous_call
                                    - team
                                    properties:
                                      uuid:
                                        type: string
                                      position:
                                        type: integer
                                        description: エスカレーションの順番。0 から始まる
                                      step_type:
                                        type: string
                                        enum:
                                        - primary
                                        - fallback
                                      simultaneous_call:
                                        type: boolean
                                        description: true のステップでは、チームの今有効なローテの参加者全員に同時に架電する（画面の「全員に同時」）
                                      team:
                                        type: object
                                        required:
                                        - uuid
                                        - name
                                        - color
                                        properties:
                                          uuid:
                                            type: string
                                          name:
                                            type: string
                                          color:
                                            type: string
                                            description: 6 桁の 16 進数（# なし）
                                  on_duty_user:
                                    description: |
                                      その時間帯の当番。次の場合は null になる。
                                      ローテーションの参加者が全員不在のとき / ローテーションがまだ始まっていないとき / 参加者が 1 人もいないとき。
                                    oneOf:
                                    - type: object
                                      required:
                                      - sub
                                      - nickname
                                      - picture
                                      - status
                                      - slack_user
                                      - phone_verified
                                      - created_at
                                      properties:
                                        sub:
                                          type: string
                                        nickname:
                                          type: string
                                        picture:
                                          type: string
                                        status:
                                          type: string
                                          enum:
                                          - active
                                          - inactive
                                          - invited
                                          - invitation_pending
                                          - invitation_failed
                                          - deactivated
                                        slack_user:
                                          oneOf:
                                          - type: object
                                            required:
                                            - key
                                            properties:
                                              key:
                                                type: string
                                          - type: 'null'
                                        phone_verified:
                                          type: boolean
                                          description: 電話番号の認証が済んでいるか。オンコールのローテーションに入れられるのは認証済みのユーザーだけ。
                                        created_at:
                                          type: string
                                          format: date-time
                                    - type: 'null'
                                  start_at:
                                    type: string
                                    format: date-time
                                    description: 開始時刻。オフセットはエスカレーションポリシーの timezone
                                      に従う
                                  end_at:
                                    type: string
                                    format: date-time
                                    description: |
                                      終了時刻。オフセットはエスカレーションポリシーの timezone に従う。
                                      日付をまたぐ時間帯（例 22:00-02:00）では、start_at の翌日になる。
                                      時間帯の終了時刻が 23:59 のときは、翌日の 00:00 になる。
                                  override:
                                    description: |
                                      この時間帯の当番が代役のときの代役の登録。
                                      代役が不在などで本来の当番の次の人が当番になっている時間帯や、代役の登録が無い時間帯では null になる。
                                    oneOf:
                                    - type: object
                                      description: ローテーションの代役の登録。start_at から end_at
                                        の直前まで、本来の当番より user が当番になる
                                      required:
                                      - uuid
                                      - user
                                      - replaced_user
                                      - start_at
                                      - end_at
                                      - reason
                                      properties:
                                        uuid:
                                          type: string
                                        user:
                                          type: object
                                          required:
                                          - sub
                                          - nickname
                                          - picture
                                          - status
                                          - slack_user
                                          - phone_verified
                                          - created_at
                                          properties:
                                            sub:
                                              type: string
                                            nickname:
                                              type: string
                                            picture:
                                              type: string
                                            status:
                                              type: string
                                              enum:
                                              - active
                                              - inactive
                                              - invited
                                              - invitation_pending
                                              - invitation_failed
                                              - deactivated
                                            slack_user:
                                              oneOf:
                                              - type: object
                                                required:
                                                - key
                                                properties:
                                                  key:
                                                    type: string
                                              - type: 'null'
                                            phone_verified:
                                              type: boolean
                                              description: 電話番号の認証が済んでいるか。オンコールのローテーションに入れられるのは認証済みのユーザーだけ。
                                            created_at:
                                              type: string
                                              format: date-time
                                        replaced_user:
                                          description: 登録した時点（期間の開始時刻）で本来の当番だった人。記録用。ユーザーが削除されていると
                                            null
                                          oneOf:
                                          - type: object
                                            required:
                                            - sub
                                            - nickname
                                            - picture
                                            - status
                                            - slack_user
                                            - phone_verified
                                            - created_at
                                            properties:
                                              sub:
                                                type: string
                                              nickname:
                                                type: string
                                              picture:
                                                type: string
                                              status:
                                                type: string
                                                enum:
                                                - active
                                                - inactive
                                                - invited
                                                - invitation_pending
                                                - invitation_failed
                                                - deactivated
                                              slack_user:
                                                oneOf:
                                                - type: object
                                                  required:
                                                  - key
                                                  properties:
                                                    key:
                                                      type: string
                                                - type: 'null'
                                              phone_verified:
                                                type: boolean
                                                description: 電話番号の認証が済んでいるか。オンコールのローテーションに入れられるのは認証済みのユーザーだけ。
                                              created_at:
                                                type: string
                                                format: date-time
                                          - type: 'null'
                                        start_at:
                                          type: string
                                          format: date-time
                                          description: 開始時刻。オフセットはエスカレーションポリシーの timezone
                                            に従う
                                        end_at:
                                          type: string
                                          format: date-time
                                          description: 終了時刻（この時刻は含まない）。オフセットはエスカレーションポリシーの
                                            timezone に従う
                                        reason:
                                          type:
                                          - string
                                          - 'null'
                                    - type: 'null'
              example:
                schedule:
                  escalation_policy:
                    uuid: 8f14e45f-ceea-467a-9f8a-5f0b1d3c9a21
                    name: バックエンド一次対応
                    timezone: Asia/Tokyo
                  days:
                  - date: '2026-09-21'
                    day_of_week: 1
                    active: true
                    entries:
                    - escalation_policy_step:
                        uuid: 3c6e0b8a-9c15-4f2d-b1a7-2e4d6f8a0b13
                        position: 0
                        step_type: primary
                        simultaneous_call: false
                        team:
                          uuid: a87ff679-a2f3-4e71-9c1d-8b2e5f7a3c46
                          name: バックエンド
                          color: 6366f1
                      on_duty_user:
                        sub: auth0|000000000000000000000001
                        nickname: yamada
                        picture: https://example.com/avatar.png
                        status: active
                        slack_user:
                          key: U0123456789
                        created_at: '2026-04-01T10:00:00+09:00'
                      start_at: '2026-09-21T22:00:00+09:00'
                      end_at: '2026-09-22T02:00:00+09:00'
                  - date: '2026-09-22'
                    day_of_week: 2
                    active: true
                    entries:
                    - escalation_policy_step:
                        uuid: 3c6e0b8a-9c15-4f2d-b1a7-2e4d6f8a0b13
                        position: 0
                        step_type: primary
                        simultaneous_call: false
                        team:
                          uuid: a87ff679-a2f3-4e71-9c1d-8b2e5f7a3c46
