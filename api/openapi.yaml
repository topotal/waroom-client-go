openapi: 3.0.3
info:
  title: Waroom API
  version: v0
servers:
  - url: https://api.app.waroom.com/api/v0
security:
  - bearerAuth: []  # 全オペレーションにBearer必須

paths:
  /incidents:
    get:
      summary: List incidents
      parameters:
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, default: 50 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: sort_order
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidents:
                    type: array
                    items: { $ref: '#/components/schemas/IncidentSummary' }
                  response_metadata:
                    $ref: '#/components/schemas/Pagination'
                required: [incidents, response_metadata]
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      summary: Create incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service_name: { type: string }
                title: { type: string }
                severity:
                  type: string
                  enum: [UNKNOWN, INFO, LOW, HIGH, CRITICAL] # 暫定
                experimental: { type: boolean, default: false }
                description: { type: string }
                is_private: { type: boolean, default: false }
              required: [service_name, title, severity]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '400':
          description: Bad Request
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: Not Found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: Unprocessable Entity
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /incidents/{incident_uuid}:
    get:
      summary: Get incident
      parameters:
        - in: path
          name: incident_uuid
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '404':
          description: Not Found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Pagination:
      type: object
      properties:
        current_page: { type: integer, minimum: 1 }
        next_page: { type: integer, nullable: true }
        prev_page: { type: integer, nullable: true }
        total_pages: { type: integer, minimum: 0 }
        total_count: { type: integer, minimum: 0 }
      required: [current_page, total_pages, total_count]

    IncidentSummary:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        title: { type: string }
        severity:
          type: string
          enum: [UNKNOWN, INFO, LOW, HIGH, CRITICAL] # 暫定
        status:
          type: string
          description: "値は暫定。実APIに合わせて確定"
        root_cause: { type: string, nullable: true }
        metrics:
          type: object
          properties:
            ttd: { type: integer, format: int64 }
            tta: { type: integer, format: int64 }
            tti: { type: integer, format: int64 }
            ttf: { type: integer, format: int64 }
            ttr: { type: integer, format: int64 }
        experimental: { type: boolean }
        service:
          type: object
          properties:
            name: { type: string }
        labels:
          type: array
          items:
            type: object
            properties:
              uuid: { type: string, format: uuid }
              key: { type: string }
              value: { type: string }
        created_at: { type: string, format: date-time }
      required: [uuid, title, severity, status, created_at]

    Incident:
      allOf:
        - $ref: '#/components/schemas/IncidentSummary'
        - type: object
          properties:
            state_document: { type: string, description: "markdown" }
            postmortems:
              type: array
              items:
                type: object
                properties:
                  uuid: { type: string, format: uuid }
                  title: { type: string }
                  blob: { type: string }
                  status: { type: string }
            incident_slack_channel: { type: string, nullable: true }

    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
      required: [message]

  responses:
    Unauthorized:
      description: Unauthorized
