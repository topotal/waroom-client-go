          application/json:
            schema:
              type: object
              properties:
                label_uuids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Array of label UUIDs to assign to the incident
      responses:
        '200':
          description: Labels updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - labels
                properties:
                  labels:
                    type: array
