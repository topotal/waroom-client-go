---
openapi: 3.1.0
info:
  title: Waroom V0 Public API
  version: 0.1.0
  description: Public API for Waroom incident management
servers:
- url: https://api.app.waroom.com
tags:
- name: Services
  description: サービス管理
- name: Incidents
  description: インシデント管理
- name: Action Items
  description: アクションアイテム管理
- name: Labels
  description: ラベル管理
- name: Postmortems
  description: ポストモーテム管理
- name: Postmortem Templates
  description: ポストモーテムテンプレート管理
- name: Runbooks
  description: ランブック管理
- name: Runbook Rules
  description: ランブックルール管理
- name: Incident Description Template
  description: インシデント説明テンプレート（Slack起票時の初期説明文）
- name: Users
  description: ユーザー管理
- name: Webhook Configurations
  description: Webhook 配信設定管理
- name: On-Call
  description: オンコール
paths:
  "/api/v0/services":
    get:
      tags:
      - Services
      operationId: listServices
      summary: List services
      security:
      - bearerAuth: []
      responses:
        '200':
          description: List of services
          content:
            application/json:
              schema:
                type: object
                required:
                - services
                - response_metadata
                properties:
                  services:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      properties:
                        name:
                          type: string
                  response_metadata:
                    type: object
                    required:
                    - current_page
                    - next_page
                    - prev_page
                    - total_pages
                    - total_count
                    properties:
                      current_page:
                        type: integer
                      next_page:
                        type:
                        - integer
                        - 'null'
                      prev_page:
                        type:
                        - integer
                        - 'null'
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: string
        '402':
          description: Payment required. The V0 Public API is available only on the
            Team or Pro plan.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
    post:
      tags:
      - Services
      operationId: createService
      summary: Create a service
      description: |
        Creates a service in the organization.
        Returns 422 when the name is invalid or already taken, or when the organization has reached the service limit of its plan.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - service
              properties:
                service:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                      description: Service name. Letters, digits, underscores, hyphens,
                        Hiragana, Katakana and Kanji are allowed.
      responses:
        '201':
          description: Service created
          content:
            application/json:
              schema:
                type: object
                required:
                - service
                properties:
                  service:
                    type: object
                    required:
                    - name
                    properties:
                      name:
                        type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: string
        '402':
          description: Payment required. The V0 Public API is available only on the
            Team or Pro plan.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  "/api/v0/incidents":
    get:
      tags:
      - Incidents
      operationId: listIncidents
      summary: List incidents
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 50
      - name: sort_order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: List of incidents
          content:
            application/json:
              schema:
                type: object
                required:
                - incidents
                - response_metadata
                properties:
                  incidents:
                    type: array
                    items:
                      type: object
                      required:
                      - uuid
                      - title
                      - severity
                      - status
                      - root_cause
                      - experimental
                      - metrics
                      - service
                      - labels
                      - created_at
                      properties:
                        uuid:
                          type: string
                          format: uuid
                        title:
                          type: string
                        severity:
                          type: string
                          description: Severity label (translated)
                        status:
                          type: string
                          description: Status (Japanese translation)
                        root_cause:
                          type: string
                          description: Root cause (Japanese translation)
                        experimental:
                          type: boolean
                        metrics:
                          type: object
                          required:
                          - ttd
                          - tta
                          - tti
                          - ttf
                          - ttr
                          properties:
                            ttd:
                              type:
                              - integer
                              - 'null'
                              description: Time to Detect (seconds)
                            tta:
                              type:
                              - integer
                              - 'null'
                              description: Time to Acknowledge (seconds)
                            tti:
                              type:
                              - integer
                              - 'null'
                              description: Time to Investigate (seconds)
                            ttf:
                              type:
                              - integer
                              - 'null'
                              description: Time to Fix (seconds)
                            ttr:
                              type:
                              - integer
                              - 'null'
                              description: Time to Resolve (seconds)
                        service:
                          type: object
                          required:
                          - name
                          properties:
                            name:
                              type: string
                        labels:
                          type: array
                          items:
                            type: object
                            required:
                            - name
                            properties:
                              name:
                                type: string
                        created_at:
                          type: string
                          format: date-time
                  response_metadata:
                    type: object
                    required:
                    - current_page
                    - next_page
                    - prev_page
                    - total_pages
                    - total_count
                    properties:
                      current_page:
                        type: integer
                      next_page:
                        type:
                        - integer
                        - 'null'
                      prev_page:
                        type:
                        - integer
                        - 'null'
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: string
        '402':
          description: Payment required. The V0 Public API is available only on the
            Team or Pro plan.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
    post:
      tags:
      - Incidents
      operationId: createIncident
      summary: Create a new incident
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - incident
              properties:
                incident:
                  type: object
                  required:
                  - service_name
                  - title
                  - severity
                  properties:
                    service_name:
                      type: string
                    title:
                      type: string
                    severity:
                      type: string
                      enum:
                      - critical
                      - high
                      - low
                      - info
                      - unknown
                    experimental:
                      type: boolean
                      default: false
                    description:
                      type: string
                    is_private:
                      type: boolean
                      default: false
      responses:
        '201':
          description: Incident created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - uuid
                - title
                - severity
                - status
                - root_cause
                - experimental
                - metrics
                - service
                - labels
                - created_at
                properties:
                  uuid:
                    type: string
                    format: uuid
                  title:
                    type: string
                  severity:
                    type: string
                    description: Severity label (translated)
                  status:
                    type: string
                    description: Status (Japanese translation)
                  root_cause:
                    type: string
                    description: Root cause (Japanese translation)
                  experimental:
                    type: boolean
                  metrics:
                    type: object
                    required:
                    - ttd
                    - tta
                    - tti
                    - ttf
                    - ttr
                    properties:
                      ttd:
                        type:
                        - integer
                        - 'null'
                        description: Time to Detect (seconds)
                      tta:
                        type:
                        - integer
                        - 'null'
                        description: Time to Acknowledge (seconds)
                      tti:
                        type:
                        - integer
                        - 'null'
                        description: Time to Investigate (seconds)
                      ttf:
                        type:
                        - integer
                        - 'null'
                        description: Time to Fix (seconds)
                      ttr:
                        type:
                        - integer
                        - 'null'
                        description: Time to Resolve (seconds)
                  service:
                    type: object
                    required:
                    - name
                    properties:
                      name:
                        type: string
                  labels:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      properties:
                        name:
                          type: string
                  created_at:
                    type: string
                    format: date-time
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: string
        '402':
          description: Payment required. The V0 Public API is available only on the
            Team or Pro plan.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  "/api/v0/incidents/{uuid}":
