  "/api/v0/on_call/escalation_policies":
    get:
      tags:
      - On-Call
      operationId: listOnCallEscalationPolicies
      summary: List on-call escalation policies
      description: |
        エスカレーションポリシーを、エスカレーションの順番と有効な時間帯つきで返す。
        当番表そのものは /api/v0/on_call/escalation_policies/{uuid}/schedule で取得する。
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: List of escalation policies
          content:
            application/json:
              schema:
                type: object
                required:
                - escalation_policies
                - response_metadata
                properties:
                  escalation_policies:
                    type: array
                    items:
                      type: object
                      required:
                      - uuid
                      - name
                      - timezone
                      - team_call_mode
                      - steps
                      - time_slots
                      properties:
                        uuid:
                          type: string
                        name:
                          type: string
                        timezone:
                          type: string
                          description: 当番表を組む基準になるタイムゾーン（IANA 形式）
                        team_call_mode:
                          type: string
                          enum:
                          - all_members
                          - on_duty_only
                          description: |
                            各ステップのチームで誰に架電するか。
                            all_members は当番から順にチームの全員に架電し、全員が出なければ次のステップへ進む。
                            on_duty_only は当番だけに架電し、出なければ（架電できなくても）次のステップへ進む。
                            どちらでも、simultaneous_call のステップではチームの全員に同時に架電する
                        steps:
                          type: array
                          description: エスカレーションの順番（position の昇順）
                          items:
                            type: object
                            required:
                            - uuid
                            - position
                            - step_type
                            - simultaneous_call
                            - team
                            properties:
                              uuid:
                                type: string
                              position:
                                type: integer
                                description: エスカレーションの順番。0 から始まる
                              step_type:
                                type: string
                                enum:
                                - primary
                                - fallback
                              simultaneous_call:
                                type: boolean
                                description: true のステップでは、チームの今有効なローテの参加者全員に同時に架電する（画面の「全員に同時」）
                              team:
                                type: object
                                required:
                                - uuid
                                - name
                                - color
                                properties:
                                  uuid:
                                    type: string
                                  name:
                                    type: string
                                  color:
                                    type: string
                                    description: 6 桁の 16 進数（# なし）
                        time_slots:
                          type: array
                          description: オンコールが有効な曜日と時間帯。day_of_week、start_time の順に並ぶ
                          items:
                            type: object
                            required:
                            - uuid
                            - day_of_week
                            - start_time
                            - end_time
                            properties:
                              uuid:
                                type: string
                              day_of_week:
                                type: integer
                                minimum: 0
                                maximum: 6
                                description: 0 が日曜、6 が土曜
                              start_time:
                                type: string
                                description: 開始時刻（HH:MM）。エスカレーションポリシーの timezone における時刻
                              end_time:
                                type: string
                                description: |
                                  終了時刻（HH:MM）。エスカレーションポリシーの timezone における時刻。
                                  start_time より前の値のときは翌日まで続く時間帯を表す（例 22:00-02:00）。
                                  23:59 は日末（翌日 00:00 の直前）までを含む。
                  response_metadata:
                    type: object
                    required:
                    - current_page
                    - next_page
                    - prev_page
                    - total_pages
                    - total_count
                    properties:
                      current_page:
                        type: integer
                      next_page:
                        type:
                        - integer
                        - 'null'
                      prev_page:
                        type:
                        - integer
                        - 'null'
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: string
        '402':
          description: Payment required. The on-call API requires the on-call plan
            or the on-call option.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
