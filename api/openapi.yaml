                                  - call_timeout: user が時間内に応答しなかった
                                  - acked: user が応答した
                                  - user_skipped: user を飛ばした（理由は skip_reason）
                                  - team_exhausted: team に架電できる人がいなくなった
                                  - team_changed: 次の team に移った（user は前の team で最後に架電した相手）
