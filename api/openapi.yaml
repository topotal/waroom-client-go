  "/api/v0/on_call/sessions":
    get:
      tags:
      - On-Call
      operationId: listOnCallSessions
      summary: List on-call sessions
      description: |
        オンコールのセッション（1 回の呼び出しで、誰に架電し誰が応答したかの流れ）を、新しい順に返す。
        インシデント一覧と同じく、非公開のインシデントのセッションは返さない。
        セッションの中で起きたこと（activities）は、セッションの取得で返す。
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - running
          - repeating
          - acked
          - exhausted
          - cancelled
        description: この状態のセッションだけを返す
      - name: incident_uuid
        in: query
        required: false
        schema:
          type: string
        description: このインシデントのセッションだけを返す
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: List of on-call sessions
          content:
            application/json:
              schema:
                type: object
                required:
                - sessions
                - response_metadata
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      required:
                      - uuid
                      - status
                      - source
                      - current_step_position
                      - current_repeat
                      - incident
                      - escalation_policy
                      - target_user
                      - trigger
                      - created_by
                      - acked_by
                      - acked_at
                      - created_at
                      properties:
                        uuid:
                          type: string
                        status:
                          type: string
                          enum:
                          - running
                          - repeating
                          - acked
                          - exhausted
                          - cancelled
                          description: |
                            running は架電中、repeating はエスカレーションを最初からやり直している途中、acked は誰かが応答した、
                            exhausted は誰も応答しないまま終わった、cancelled は取り消された
                        source:
                          type: string
                          enum:
                          - integration
                          - slack
                          - web
                          description: オンコールを呼び出した起点
                        current_step_position:
                          type: integer
                          minimum: 0
                          description: いま架電しているエスカレーションポリシーのステップの位置
                        current_repeat:
                          type: integer
                          minimum: 0
                          description: エスカレーションを最初からやり直した回数
                        incident:
                          type: object
                          required:
                          - uuid
                          properties:
                            uuid:
                              type: string
                        escalation_policy:
                          description: 呼び出したエスカレーションポリシー。1 人だけに架電したセッションでは null（代わりに
                            target_user を持つ）
                          oneOf:
                          - type: object
                            required:
                            - uuid
                            - name
                            properties:
                              uuid:
                                type: string
                              name:
                                type: string
                          - type: 'null'
                        target_user:
                          description: 1 人だけに架電したセッションで架電した相手。エスカレーションポリシーを辿ったセッションや、ユーザーが削除されたときは
                            null
                          oneOf:
                          - type: object
                            required:
                            - sub
                            - nickname
                            - picture
                            - status
                            - slack_user
                            - phone_verified
                            - created_at
                            properties:
                              sub:
                                type: string
                              nickname:
                                type: string
                              picture:
                                type: string
                              status:
                                type: string
                                enum:
                                - active
                                - inactive
                                - invited
                                - invitation_pending
                                - invitation_failed
                                - deactivated
                              slack_user:
                                oneOf:
                                - type: object
                                  required:
                                  - key
                                  properties:
                                    key:
                                      type: string
                                - type: 'null'
                              phone_verified:
                                type: boolean
                                description: 電話番号の認証が済んでいるか。オンコールのローテーションに入れられるのは認証済みのユーザーだけ。
                              created_at:
                                type: string
                                format: date-time
                          - type: 'null'
                        trigger:
                          description: 呼び出したトリガー。手動で呼び出したときや、トリガーが削除されたときは null
                          oneOf:
                          - type: object
                            required:
                            - uuid
                            - name
                            properties:
                              uuid:
                                type: string
                              name:
                                type: string
                          - type: 'null'
                        created_by:
                          description: 手動で呼び出したユーザー。トリガーから呼び出したときは null
                          oneOf:
                          - type: object
                            required:
                            - sub
                            - nickname
                            - picture
                            - status
                            - slack_user
                            - phone_verified
                            - created_at
                            properties:
                              sub:
                                type: string
                              nickname:
                                type: string
                              picture:
                                type: string
                              status:
                                type: string
                                enum:
                                - active
                                - inactive
                                - invited
                                - invitation_pending
                                - invitation_failed
                                - deactivated
                              slack_user:
                                oneOf:
                                - type: object
                                  required:
                                  - key
                                  properties:
                                    key:
                                      type: string
                                - type: 'null'
                              phone_verified:
                                type: boolean
                                description: 電話番号の認証が済んでいるか。オンコールのローテーションに入れられるのは認証済みのユーザーだけ。
                              created_at:
                                type: string
                                format: date-time
                          - type: 'null'
                        acked_by:
                          description: 応答したユーザー
                          oneOf:
                          - type: object
                            required:
                            - sub
                            - nickname
                            - picture
                            - status
                            - slack_user
                            - phone_verified
                            - created_at
                            properties:
                              sub:
                                type: string
                              nickname:
                                type: string
                              picture:
                                type: string
                              status:
                                type: string
                                enum:
                                - active
                                - inactive
                                - invited
                                - invitation_pending
                                - invitation_failed
                                - deactivated
                              slack_user:
                                oneOf:
                                - type: object
                                  required:
                                  - key
                                  properties:
                                    key:
                                      type: string
                                - type: 'null'
                              phone_verified:
                                type: boolean
                                description: 電話番号の認証が済んでいるか。オンコールのローテーションに入れられるのは認証済みのユーザーだけ。
                              created_at:
                                type: string
                                format: date-time
                          - type: 'null'
                        acked_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          readOnly: true
                        created_at:
                          type: string
                          format: date-time
                          readOnly: true
                  response_metadata:
                    type: object
                    required:
                    - current_page
                    - next_page
                    - prev_page
                    - total_pages
                    - total_count
                    properties:
                      current_page:
                        type: integer
                      next_page:
                        type:
                        - integer
                        - 'null'
                      prev_page:
                        type:
                        - integer
                        - 'null'
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: string
        '402':
