# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2
project_name: waroom-client-go

dist: dist

# This is a library: publish a GitHub Release only, no binaries.
builds:
  - skip: true

# Release notes come from the tag's section of CHANGELOG.md
# (passed with --release-notes by .github/workflows/release.yaml).
changelog:
  disable: true

release:
  prerelease: auto
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
