version: "3.9"
services:
  web:
    # NOTE: 将来public repoにしたときこれが露出していいのかどうか
    # override docker-compose.override.yaml if needed
    image: waroom-backend
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: production
      DATABASE_URL: "mysql2://app:app@db:3306/app_development"
      REDIS_URL: "redis://redis:6379/1"
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0 # 8.0.mysql_aurora.3.08.2
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app_development
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

volumes:
  db-data:
