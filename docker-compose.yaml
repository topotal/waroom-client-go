version: "3.9"
services:
  web:
    # NOTE: 将来public repoにしたときこれが露出していいのかどうか
    # override docker-compose.override.yaml if needed
    image: waroom-backend
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: production
      DATABASE_URL: "mysql2://app:app@db:3306/app_development"
      REDIS_URL: "redis://redis:6379/1"
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.3@sha256:9de9d54fecee6253130e65154b930978b1fcc336bcc86dfd06e89b72a2588ebe # 8.0.mysql_aurora.3.08.2
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app_development
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine@sha256:ee64a64eaab618d88051c3ade8f6352d11531fcf79d9a4818b9b183d8c1d18ba
    ports:
      - "6379:6379"

volumes:
  db-data:
