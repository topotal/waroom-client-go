name: OAS Auto Committer

# Commits regenerated internal/ogen/ to the PR branch.
#
#   generate: runs PR code (task gen) with no secrets -> uploads the diff as a patch
#   commit:   runs no PR code; applies the patch and commits it with the App token
#
# The App token (not GITHUB_TOKEN) is used so that the new commit triggers CI.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: auto-gen-commit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.diff.outputs.sha }}
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.66.1

      - run: task gen

      - id: diff
        run: |
          git add -A internal/ogen
          git diff --cached --binary --no-renames --no-color > "$RUNNER_TEMP/ogen.patch"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=$([ -s "$RUNNER_TEMP/ogen.patch" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ogen-patch
          path: ${{ runner.temp }}/ogen.patch
          retention-days: 1

  commit:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ needs.generate.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ogen-patch
          path: ${{ runner.temp }}

      - name: Apply patch (internal/ogen/ only)
        run: |
          if git apply --numstat "$RUNNER_TEMP/ogen.patch" | cut -f3 | grep -vE '^internal/ogen/'; then
            echo "::error::patch touches files outside internal/ogen/"
            exit 1
          fi
          git apply "$RUNNER_TEMP/ogen.patch"

      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.WAROOM_ECOSYSTEM_APP_CLIENT_ID }}
          private-key: ${{ secrets.WAROOM_ECOSYSTEM_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: suzuki-shunsuke/commit-action@5eaa5ecce3ffe93d09a85b946dc5136e3713b1b7 # v1.1.0
        with:
          commit_message: "api: auto-generate code from OpenAPI spec"
          branch: ${{ github.head_ref }}
          github_token: ${{ steps.app-token.outputs.token }}
